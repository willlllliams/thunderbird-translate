<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sample message</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f3f4f6;
        font: 14px/1.4 "Segoe UI", system-ui, sans-serif;
        color: #1f2328;
      }
      .pane {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        background: #fff;
      }
      .header {
        padding: 14px 28px 12px;
        border-bottom: 1px solid #d8dbe0;
        background: #f7f8fa;
        position: relative;
      }
      .subject {
        font-size: 19px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .line {
        color: #4b5563;
      }
      .line b {
        display: inline-block;
        width: 46px;
        font-weight: 600;
        color: #6b7280;
      }
      .toolbar {
        position: absolute;
        right: 24px;
        top: 14px;
        display: flex;
        gap: 6px;
      }
      .toolbar span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 10px;
        border: 1px solid #d0d4da;
        border-radius: 6px;
        background: #fff;
        color: #374151;
        font-size: 13px;
      }
      .toolbar span.on {
        border-color: #4c8bf5;
        box-shadow: 0 0 0 2px color-mix(in srgb, #4c8bf5 25%, transparent);
      }
      .toolbar img {
        width: 16px;
        height: 16px;
      }
      iframe.body {
        flex: 1;
        border: 0;
        width: 100%;
      }
      iframe.popup {
        position: absolute;
        right: 24px;
        top: 50px;
        width: 330px;
        height: 530px;
        border: 1px solid #c9ced6;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
      }
    </style>
  </head>
  <body>
    <div class="pane">
      <div class="header">
        <div class="subject">Projekt Nordlicht – Unterlagen für die Abnahme</div>
        <div class="line"><b>From</b> Katrin Vogel &lt;katrin.vogel@example.com&gt;</div>
        <div class="line"><b>To</b> Project team &lt;team@example.org&gt;</div>
        <div class="line"><b>Date</b> Tue, 13 Oct 2026 09:12</div>
        <div class="toolbar">
          <span>Reply</span><span>Forward</span><span id="button"><img src="/icons/icon-16.svg" alt="" />Translate message</span>
        </div>
      </div>
      <iframe class="body" id="body"></iframe>
    </div>
    <script>
      const shot = new URLSearchParams(location.search).get("shot") || "bilingual"
      document.getElementById("body").src = `/__shots/body.html?shot=${shot}`
      if (shot === "popup") {
        document.getElementById("button").classList.add("on")
        const popup = document.createElement("iframe")
        popup.className = "popup"
        popup.src = `/popup.html?shot=${shot}`
        document.querySelector(".pane").append(popup)
      }
    </script>
  </body>
</html>
