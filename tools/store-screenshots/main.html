<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mail tab</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f3f4f6;
        font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
        color: #1f2328;
      }
      .window {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-rows: 46px 1fr;
        grid-template-columns: 250px 1fr;
      }
      .toolbar {
        grid-column: 1 / 3;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 16px;
        border-bottom: 1px solid #d8dbe0;
        background: #f7f8fa;
      }
      .toolbar span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 10px;
        border: 1px solid #d0d4da;
        border-radius: 6px;
        background: #fff;
        color: #374151;
      }
      .toolbar .search {
        flex: 1;
        max-width: 420px;
        margin: 0 auto;
        color: #9ca3af;
      }
      .toolbar .on {
        border-color: #4c8bf5;
        box-shadow: 0 0 0 2px color-mix(in srgb, #4c8bf5 25%, transparent);
      }
      .toolbar img {
        width: 16px;
        height: 16px;
      }
      .folders {
        padding: 10px 0;
        border-right: 1px solid #d8dbe0;
        background: #f7f8fa;
      }
      .folders div {
        display: flex;
        justify-content: space-between;
        padding: 4px 16px 4px calc(16px + var(--level, 0) * 16px);
        color: #374151;
      }
      .folders .account {
        font-weight: 600;
        margin-top: 4px;
      }
      .folders .selected {
        background: color-mix(in srgb, #4c8bf5 18%, transparent);
        font-weight: 600;
      }
      .folders .count {
        color: #4c8bf5;
        font-weight: 600;
      }
      .list {
        background: #fff;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        background: #fff;
      }
      th,
      td {
        padding: 6px 10px;
        border-bottom: 1px solid #eceef1;
        text-align: start;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      th {
        font-weight: 600;
        color: #6b7280;
        background: #fafbfc;
      }
      tr.unread td {
        font-weight: 600;
      }
      iframe.popup {
        position: absolute;
        right: 16px;
        top: 42px;
        width: 800px;
        border: 1px solid #c9ced6;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
      }
    </style>
    <script src="/__shots/stub.js"></script>
  </head>
  <body>
    <div class="window">
      <div class="toolbar">
        <span>Get Messages</span><span>Write</span><span class="search">Search messages</span><span class="on"><img src="/icons/icon-16.svg" alt="" />Translated subjects</span>
      </div>
      <div class="folders">
        <div class="account">anna.berger@example.com</div>
        <div class="selected" style="--level: 1"><span>Inbox</span><span class="count">3</span></div>
        <div style="--level: 1">Drafts</div>
        <div style="--level: 1">Sent</div>
        <div style="--level: 1">Archives</div>
        <div style="--level: 1">Projects</div>
        <div style="--level: 2">Nordlicht</div>
        <div style="--level: 2">Catalogue 2027</div>
        <div style="--level: 1">Suppliers</div>
        <div style="--level: 1">Sailing club</div>
        <div style="--level: 1">Travel</div>
        <div style="--level: 1">Junk</div>
        <div style="--level: 1">Trash</div>
        <div class="account">Local Folders</div>
        <div style="--level: 1">Invoices 2026</div>
      </div>
      <div class="list">
        <table>
          <colgroup><col style="width: 30%" /><col /><col style="width: 150px" /></colgroup>
          <thead>
            <tr><th>From</th><th>Subject</th><th>Date</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
    <script>
      // The message list of the inbox is the one stub.js gives the page of translated subjects; the page is the popup of
      // the extension's button in the main toolbar.
      const format = new Intl.DateTimeFormat("en", { dateStyle: "short", timeStyle: "short" })
      browser.mailTabs.getListedMessages(1).then(({ messages }) => {
        for (const m of messages) {
          const tr = document.createElement("tr")
          if (!m.read) tr.className = "unread"
          for (const text of [m.author.replace(/\s*<.*$/, ""), m.subject, format.format(new Date(m.date))]) tr.append(Object.assign(document.createElement("td"), { textContent: text }))
          document.getElementById("rows").append(tr)
        }
      })
      const popup = document.createElement("iframe")
      popup.className = "popup"
      popup.id = "popup"
      popup.src = "/subjects.html?shot=subjects"
      // As in Thunderbird, the popup takes the height of its page, up to 600 pixels.
      const fit = () => {
        const doc = popup.contentDocument
        if (doc?.body) popup.style.height = `${Math.min(Math.ceil(doc.body.getBoundingClientRect().height), 600)}px`
        requestAnimationFrame(fit)
      }
      popup.addEventListener("load", fit)
      document.querySelector(".window").append(popup)
    </script>
  </body>
</html>
