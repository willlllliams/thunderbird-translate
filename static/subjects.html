<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title data-i18n="subjectsTitle"></title>
    <link rel="stylesheet" href="subjects.css" />
    <link rel="stylesheet" href="content.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon-16.svg" alt="" width="20" height="20" />
      <h1 data-i18n="subjectsTitle"></h1>
      <button type="button" id="openWindow" data-i18n="subjectsOpenWindow" data-i18n-title="tipSubjectsOpenWindow" hidden></button>
    </header>
    <p id="status" class="status" role="status"></p>
    <p id="progress" class="progress" role="status" hidden></p>
    <div id="list">
      <table id="subjects" hidden>
        <thead>
          <tr>
            <th class="from" data-i18n="subjectsColFrom"></th>
            <th class="date" data-i18n="subjectsColDate"></th>
            <th class="subject" data-i18n="subjectsColSubject"></th>
            <th class="translated" data-i18n="subjectsColTranslation"></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="more"><button type="button" id="more" data-i18n="subjectsMore" data-i18n-title="tipSubjectsMore" hidden></button></p>
    <script src="subjects.js"></script>
  </body>
</html>
