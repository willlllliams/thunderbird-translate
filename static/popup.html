<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title data-i18n="extensionName"></title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon.svg" alt="" width="20" height="20" />
      <span data-i18n="extensionName"></span>
    </header>

    <div class="actions">
      <button id="toggle" class="primary" type="button" data-i18n="popupTranslate"></button>
      <button id="retranslate" class="secondary" type="button" data-i18n="popupRetranslate" data-i18n-title="popupRetranslateHint" hidden></button>
    </div>
    <p id="status" class="status"></p>
    <p id="lastError" class="last-error" hidden></p>

    <div class="field">
      <span class="label" data-i18n="labelMode"></span>
      <div class="segmented" role="radiogroup" data-i18n-aria-label="labelMode">
        <label><input type="radio" name="mode" value="bilingual" /><span data-i18n="modeBilingual"></span></label>
        <label><input type="radio" name="mode" value="translation-only" /><span data-i18n="modeTranslationOnly"></span></label>
      </div>
    </div>

    <div class="languages">
      <label class="field">
        <span class="label" data-i18n="labelSourceLang"></span>
        <select id="sourceLang"></select>
      </label>
      <label class="field">
        <span class="label" data-i18n="labelTargetLang"></span>
        <select id="targetLang"></select>
      </label>
    </div>
    <p id="sameLanguage" class="warning" data-i18n="hintSameLanguage" hidden></p>

    <div class="field">
      <span class="label" data-i18n="labelTiers"></span>
      <label class="tier"><span id="tierLabel-dictionary"></span><select id="tier-dictionary"></select></label>
      <label class="tier"><span id="tierLabel-machine"></span><select id="tier-machine"></select></label>
      <label class="tier"><span id="tierLabel-ai"></span><select id="tier-ai"></select></label>
      <p id="tiersEmpty" class="warning" data-i18n="tiersEmpty" hidden></p>
      <p id="offlineMissing" class="offline-hint" role="status" hidden></p>
    </div>

    <label class="check" id="preciseRow" hidden>
      <input type="checkbox" id="preciseEnabled" />
      <span data-i18n="labelPrecise"></span>
    </label>

    <label class="check">
      <input type="checkbox" id="autoTranslate" />
      <span data-i18n="labelAutoTranslate"></span>
    </label>

    <footer>
      <a href="#" id="openOptions" data-i18n="popupSettings"></a>
      <a href="#" id="openWelcome" data-i18n="openWelcome"></a>
      <span class="hint" data-i18n="popupShortcuts"></span>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
