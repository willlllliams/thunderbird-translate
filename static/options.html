<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title data-i18n="optionsTitle"></title>
    <link rel="stylesheet" href="options.css" />
    <link rel="stylesheet" href="content.css" />
  </head>
  <body>
    <header class="top">
      <img src="icons/icon-16.svg" alt="" width="32" height="32" />
      <h1 data-i18n="optionsTitle"></h1>
      <span id="saved" class="saved" data-i18n="saved" data-i18n-title="tipSaved"></span>
      <button type="button" id="openWelcome" data-i18n="openWelcome" data-i18n-title="tipOpenWelcome"></button>
    </header>

    <main>
      <section>
        <h2 data-i18n="sectionGeneral"></h2>
        <div class="grid">
          <label data-i18n-title="tipUiLanguage">
            <span data-i18n="labelUiLanguage"></span>
            <select id="uiLanguage" aria-describedby="uiLanguageHint"></select>
          </label>
          <label data-i18n-title="tipSourceLang">
            <span data-i18n="labelSourceLang"></span>
            <select id="sourceLang"></select>
          </label>
          <label data-i18n-title="tipTargetLang">
            <span data-i18n="labelTargetLang"></span>
            <select id="targetLang"></select>
          </label>
          <label data-i18n-title="tipDefaultMode">
            <span data-i18n="labelDefaultMode"></span>
            <select id="mode">
              <option value="bilingual" data-i18n="modeBilingual"></option>
              <option value="translation-only" data-i18n="modeTranslationOnly"></option>
            </select>
          </label>
        </div>
        <p id="sameLanguage" class="field-warning" data-i18n="hintSameLanguage" hidden></p>
        <p class="hint" id="uiLanguageHint" data-i18n="uiLanguageHint"></p>
        <label class="check" data-i18n-title="tipAutoTranslate">
          <input type="checkbox" id="autoTranslate" />
          <span data-i18n="labelAutoTranslate"></span>
        </label>
      </section>

      <section id="tiers">
        <h2 data-i18n="labelTiers"></h2>
        <p class="hint" data-i18n="tiersHint"></p>
        <div class="grid">
          <label data-i18n-title="tipTierDictionary"><span id="tierLabel-dictionary"></span><select id="tier-dictionary"></select></label>
          <label data-i18n-title="tipTierMachine"><span id="tierLabel-machine"></span><select id="tier-machine"></select></label>
          <label data-i18n-title="tipTierAi"><span id="tierLabel-ai"></span><select id="tier-ai"></select></label>
        </div>
        <p id="tiersEmpty" class="field-warning" data-i18n="tiersEmpty" hidden></p>
        <p id="offlineMissing" class="offline-hint" role="status" hidden></p>
        <label class="check" data-i18n-title="tipPrecise">
          <input type="checkbox" id="preciseEnabled" />
          <span data-i18n="labelPrecise"></span>
        </label>
        <p class="hint" data-i18n="hintPrecise"></p>
        <p id="imagePreciseOff" class="field-warning" hidden>
          <span id="imagePreciseOffText"></span>
          <span><button type="button" id="imagePreciseOn" data-i18n="buttonPreciseOn" data-i18n-title="tipPreciseOn"></button></span>
        </p>
        <fieldset id="imageGroup" class="subgroup">
          <div class="grid">
            <label data-i18n-title="tipImageMode">
              <span data-i18n="labelImageMode"></span>
              <select id="imageMode">
                <option value="off" data-i18n="imageModeOff"></option>
                <option value="ask" data-i18n="imageModeAsk"></option>
                <option value="auto" data-i18n="imageModeAuto"></option>
              </select>
            </label>
            <label data-i18n-title="tipImageProvider"><span data-i18n="labelImageProvider"></span><select id="imageProvider"></select></label>
            <label data-i18n-title="tipImageModel"><span data-i18n="labelModel"></span><input type="text" id="imageModel" list="imageModels" spellcheck="false" /><datalist id="imageModels"></datalist></label>
          </div>
          <p class="hint" data-i18n="hintImage"></p>
          <p id="imageRemote" class="row" role="status">
            <span id="imageRemoteState"></span>
            <button type="button" id="imageRemoteAllow" data-i18n="buttonRemoteAccess" data-i18n-title="tipRemoteAccessPopup" hidden></button>
            <button type="button" id="imageRemoteRevoke" data-i18n="buttonRemoteRevoke" data-i18n-title="tipRemoteRevoke" hidden></button>
          </p>
          <p id="imageRemoteServices" class="hint" role="status" hidden></p>
          <p id="imageSupport" class="field-warning" hidden></p>
          <p class="hint"><span id="imageCost"></span> <a id="imagePrices" target="_blank" rel="noopener" data-i18n="linkPrices" data-i18n-title="tipPrices" hidden></a></p>
          <div class="row"><button type="button" id="imageTest" data-i18n="buttonTestImage" data-i18n-title="tipTestImage"></button></div>
          <div id="imageTestResult" class="test-result" aria-live="polite"></div>
          <details id="imageAdvanced">
            <summary data-i18n="imageAdvanced" data-i18n-title="tipImageAdvanced"></summary>
          <label class="check" data-i18n-title="tipImageInline"><input type="checkbox" id="imageInline" /><span data-i18n="labelImageInline"></span></label>
          <label class="check" data-i18n-title="tipImageAttachments"><input type="checkbox" id="imageAttachments" /><span data-i18n="labelImageAttachments"></span></label>
          <p class="hint" data-i18n="hintImageRemote"></p>
          <div class="grid">
            <label data-i18n-title="tipImageMax"><span data-i18n="labelImageMax"></span><input type="number" id="imageMax" min="1" max="20" /></label>
            <label data-i18n-title="tipImageMinSide"><span data-i18n="labelImageMinSide"></span><input type="number" id="imageMinSide" min="16" max="1000" /></label>
            <label data-i18n-title="tipImageMinArea"><span data-i18n="labelImageMinArea"></span><input type="number" id="imageMinArea" min="0" max="4000000" step="1000" /></label>
            <label data-i18n-title="tipImageMaxAspect"><span data-i18n="labelImageMaxAspect"></span><input type="number" id="imageMaxAspect" min="2" max="30" step="0.5" /></label>
            <label data-i18n-title="tipImageMinKB"><span data-i18n="labelImageMinKB"></span><input type="number" id="imageMinKB" min="0" max="200" /></label>
            <label data-i18n-title="tipImageAnimated">
              <span data-i18n="labelImageAnimated"></span>
              <select id="imageAnimated">
                <option value="skip" data-i18n="imageAnimatedSkip"></option>
                <option value="firstFrame" data-i18n="imageAnimatedFirst"></option>
              </select>
            </label>
            <label data-i18n-title="tipImageLongEdge"><span data-i18n="labelImageLongEdge"></span><input type="number" id="imageLongEdge" min="512" max="2576" step="8" /></label>
            <label data-i18n-title="tipImageFormat">
              <span data-i18n="labelImageFormat"></span>
              <select id="imageFormat"></select>
            </label>
            <label data-i18n-title="tipImageQuality"><span data-i18n="labelImageQuality"></span><input type="number" id="imageQuality" min="0.5" max="0.95" step="0.05" /></label>
            <label data-i18n-title="tipImageMaxKB"><span data-i18n="labelImageMaxKB"></span><input type="number" id="imageMaxKB" min="200" max="8000" step="100" /></label>
            <label data-i18n-title="tipImageMaxMB"><span data-i18n="labelImageMaxMB"></span><input type="number" id="imageMaxMB" min="1" max="30" step="0.5" /></label>
            <label data-i18n-title="tipImageDetail">
              <span data-i18n="labelImageDetail"></span>
              <select id="imageDetail">
                <option value="auto" data-i18n="imageDetailAuto"></option>
                <option value="low" data-i18n="imageDetailLow"></option>
                <option value="high" data-i18n="imageDetailHigh"></option>
              </select>
            </label>
            <label data-i18n-title="tipImageOutput">
              <span data-i18n="labelImageOutput"></span>
              <select id="imageOutput">
                <option value="table" data-i18n="imageOutputTable"></option>
                <option value="summary" data-i18n="imageOutputSummary"></option>
                <option value="both" data-i18n="imageOutputBoth"></option>
              </select>
            </label>
            <label data-i18n-title="tipImageNoText">
              <span data-i18n="labelImageNoText"></span>
              <select id="imageNoText">
                <option value="skip" data-i18n="imageNoTextSkip"></option>
                <option value="describe" data-i18n="imageNoTextDescribe"></option>
              </select>
            </label>
            <label data-i18n-title="tipImageMaxTokens"><span data-i18n="labelSummaryMaxTokens"></span><input type="number" id="imageMaxTokens" min="128" max="4096" step="64" /></label>
            <label data-i18n-title="tipImageTimeout"><span data-i18n="labelTimeout"></span><input type="number" id="imageTimeout" min="10" max="600" step="5" /></label>
            <label data-i18n-title="tipImageConcurrency"><span data-i18n="labelConcurrency"></span><input type="number" id="imageConcurrency" min="1" max="6" /></label>
            <label data-i18n-title="tipImageDisplay">
              <span data-i18n="labelImageDisplay"></span>
              <select id="imageDisplay">
                <option value="expanded" data-i18n="summaryExpanded"></option>
                <option value="collapsed" data-i18n="summaryCollapsed"></option>
              </select>
            </label>
          </div>
          <label class="check" data-i18n-title="tipImageSignature"><input type="checkbox" id="imageSignature" /><span data-i18n="labelImageSignature"></span></label>
          <label class="check" data-i18n-title="tipImageShowSource"><input type="checkbox" id="imageShowSource" /><span data-i18n="labelImageShowSource"></span></label>
          <label class="check" data-i18n-title="tipImageContext"><input type="checkbox" id="imageContext" /><span data-i18n="labelImageContext"></span></label>
          <label class="check" data-i18n-title="tipImageUsage"><input type="checkbox" id="imageUsage" /><span data-i18n="labelImageUsage"></span></label>
          <label class="check" data-i18n-title="tipImageConfirm"><input type="checkbox" id="imageConfirm" /><span data-i18n="labelImageConfirm"></span></label>
          </details>
        </fieldset>
        <h3 data-i18n="mutedPairsTitle"></h3>
        <p class="row"><span id="mutedPairs" class="hint"></span> <button type="button" id="clearMuted" data-i18n="buttonClearMuted" data-i18n-title="tipClearMuted"></button></p>
        <h3 data-i18n="consentListTitle"></h3>
        <p class="hint" data-i18n="consentListHint"></p>
        <div class="consent-columns">
          <div>
            <h4 data-i18n="consentListText"></h4>
            <ul id="consentList" class="consent-list"></ul>
          </div>
          <div>
            <h4 data-i18n="consentListImages"></h4>
            <ul id="imageConsentList" class="consent-list"></ul>
          </div>
        </div>
      </section>

      <section id="providers">
        <h2 data-i18n="sectionProviders"></h2>
        <label class="row" data-i18n-title="tipProviderFilter"><span data-i18n="providerFilterLabel"></span><select id="providerTierFilter"></select></label>
        <div class="providers">
          <ul id="providerList" class="provider-list"></ul>
          <div id="providerPanel" class="provider-panel"></div>
        </div>
      </section>

      <section id="dictionaries">
        <h2 data-i18n="sectionDictionaries"></h2>
        <p class="hint" data-i18n="dictionaryHint"></p>
        <p class="hint" data-i18n="dictionaryAttribution"></p>
        <div class="row">
          <input type="search" id="dictFilter" data-i18n-placeholder="bergamotFilter" data-i18n-aria-label="bergamotFilter" data-i18n-title="tipFilter" spellcheck="false" />
        </div>
        <div id="dictCommon" class="common"></div>
        <p id="dictStatus" class="hint" role="status"></p>
        <ul id="dictList" class="dict-list"></ul>
        <details>
          <summary data-i18n="labelDictTag" data-i18n-title="tipDictTag"></summary>
          <div class="row">
            <input type="text" id="dictReleaseTag" data-i18n-aria-label="labelDictTag" data-i18n-title="tipDictTag" spellcheck="false" />
            <button type="button" id="dictReload" data-i18n="buttonReloadList" data-i18n-title="tipDictReload"></button>
          </div>
        </details>
      </section>

      <section id="bergamot">
        <h2 data-i18n="sectionBergamot"></h2>
        <p class="hint" data-i18n="bergamotHint"></p>
        <p id="bergamotNeeded" class="hint"></p>
        <div class="row">
          <input type="search" id="bergamotFilter" data-i18n-placeholder="bergamotFilter" data-i18n-aria-label="bergamotFilter" data-i18n-title="tipFilter" spellcheck="false" />
          <button type="button" id="bergamotReload" data-i18n="buttonReloadList" data-i18n-title="tipBergamotReload"></button>
        </div>
        <div id="bergamotCommon" class="common"></div>
        <p id="bergamotStatus" class="hint" role="status"></p>
        <ul id="bergamotList" class="dict-list"></ul>
      </section>

      <section id="prompts">
        <h2 data-i18n="sectionPrompts"></h2>
        <p class="hint" data-i18n="promptsHint"></p>
        <div id="promptEditor"></div>
      </section>

      <section id="summary">
        <h2 data-i18n="sectionSummary"></h2>
        <p class="hint" data-i18n="summaryHint"></p>
        <div class="grid">
          <label data-i18n-title="tipSummaryProvider"><span data-i18n="labelSummaryProvider"></span><select id="summaryProvider"></select></label>
          <label data-i18n-title="tipSummaryModel"><span data-i18n="labelModel"></span><input type="text" id="summaryModel" spellcheck="false" /></label>
          <label data-i18n-title="tipSummaryMaxTokens"><span data-i18n="labelSummaryMaxTokens"></span><input type="number" id="summaryMaxTokens" min="200" max="4000" step="100" /></label>
          <label data-i18n-title="tipSummaryDisplay">
            <span data-i18n="labelSummaryDisplay"></span>
            <select id="summaryDisplay">
              <option value="expanded" data-i18n="summaryExpanded"></option>
              <option value="collapsed" data-i18n="summaryCollapsed"></option>
            </select>
          </label>
          <label data-i18n-title="tipSummaryAuto">
            <span data-i18n="labelSummaryAuto"></span>
            <select id="summaryAuto" aria-describedby="summaryAutoHint">
              <option value="off" data-i18n="summaryAutoOff"></option>
              <option value="translated" data-i18n="summaryAutoTranslated"></option>
              <option value="always" data-i18n="summaryAutoAlways"></option>
            </select>
          </label>
        </div>
        <p class="hint" id="summaryAutoHint" data-i18n="hintSummaryAuto"></p>
        <p id="summaryNone" class="field-warning" data-i18n="tipSummarizeNone" hidden></p>
        <div class="row" role="group" data-i18n-aria-label="labelSummaryParts">
          <span data-i18n="labelSummaryParts"></span>
          <label class="check" data-i18n-title="tipSummaryPart"><input type="checkbox" id="summaryPart-summary" /><span data-i18n="summaryPartSummary"></span></label>
          <label class="check" data-i18n-title="tipSummaryPart"><input type="checkbox" id="summaryPart-actions" /><span data-i18n="summaryPartActions"></span></label>
          <label class="check" data-i18n-title="tipSummaryPart"><input type="checkbox" id="summaryPart-questions" /><span data-i18n="summaryPartQuestions"></span></label>
          <label class="check" data-i18n-title="tipSummaryPart"><input type="checkbox" id="summaryPart-dates" /><span data-i18n="summaryPartDates"></span></label>
        </div>
        <label class="check" data-i18n-title="tipSummaryInline">
          <input type="checkbox" id="summaryInline" />
          <span data-i18n="labelSummaryInline"></span>
        </label>
        <p class="hint" data-i18n="hintSummaryShortcut"></p>
      </section>

      <section>
        <h2 data-i18n="sectionBatch"></h2>
        <div class="grid">
          <label data-i18n-title="tipBatchDelay"><span data-i18n="labelBatchDelay"></span><input type="number" id="batchDelayMs" min="0" max="2000" step="10" /></label>
          <label data-i18n-title="tipMaxChars"><span data-i18n="labelMaxChars"></span><input type="number" id="maxCharsPerBatch" min="200" max="50000" step="100" /></label>
          <label data-i18n-title="tipMaxItems"><span data-i18n="labelMaxItems"></span><input type="number" id="maxItemsPerBatch" min="1" max="200" /></label>
          <label data-i18n-title="tipConcurrency"><span data-i18n="labelConcurrency"></span><input type="number" id="concurrency" min="1" max="20" /></label>
          <label data-i18n-title="tipRetries"><span data-i18n="labelRetries"></span><input type="number" id="maxRetries" min="0" max="10" /></label>
          <label data-i18n-title="tipTimeout"><span data-i18n="labelTimeout"></span><input type="number" id="timeoutSeconds" min="5" max="600" step="5" /></label>
        </div>
        <label class="check" data-i18n-title="tipLlmBatch"><input type="checkbox" id="llmBatchEnabled" /><span data-i18n="labelLlmBatch"></span></label>
        <p class="hint" data-i18n="batchHint"></p>
      </section>

      <section>
        <h2 data-i18n="sectionStyle"></h2>
        <div id="styleControls" class="grid"></div>
        <div class="preview" id="preview">
          <p>
            <span data-i18n="stylePreviewOriginal"></span>
            <span id="previewTranslation" class="tt-translation tt-bilingual tt-flow" data-i18n="stylePreviewTranslation"></span>
          </p>
        </div>
        <label class="check" data-i18n-title="tipRenderMarkdown">
          <input type="checkbox" id="renderMarkdown" aria-describedby="renderMarkdownHint" />
          <span data-i18n="labelRenderMarkdown"></span>
        </label>
        <p class="hint" id="renderMarkdownHint" data-i18n="hintRenderMarkdown"></p>
      </section>

      <section>
        <h2 data-i18n="sectionCache"></h2>
        <div class="grid">
          <label class="check" data-i18n-title="tipCacheEnabled"><input type="checkbox" id="cacheEnabled" /><span data-i18n="labelCacheEnabled"></span></label>
          <label data-i18n-title="tipCacheMax"><span data-i18n="labelCacheMax"></span><input type="number" id="cacheMax" min="0" max="100000" step="100" /></label>
        </div>
        <p><span id="cacheCount" class="hint"></span> <button type="button" id="clearCache" data-i18n="buttonClearCache" data-i18n-title="tipClearCache"></button></p>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
