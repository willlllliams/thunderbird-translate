name: Dictionary packs

# Builds the word-for-word dictionary packs (tools/dict-build) from the current
# kaikki.org Wiktionary dumps and ECDICT, then uploads every pack plus
# dict-index.json and dict-build-report.json to the release of the given tag.
# A full run downloads about 1.25 GB, reads about 9.9 GB of JSON lines and takes
# roughly 15-30 minutes; see docs/dictionary-packs.md. dicts-v1, the release
# the extension reads, takes packs built on main only. The job that reads the
# third-party dumps has no write token; the upload job has it and runs no
# code of the repository.

on:
  workflow_dispatch:
    inputs:
      pairs:
        description: 'Comma-separated directions such as "en-de,de-en", or "all"'
        required: false
        default: all
      tag:
        description: Release tag that receives the packs
        required: false
        default: dicts-v1

permissions:
  contents: read

concurrency:
  group: dicts-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      PAIRS: ${{ inputs.pairs }}
      TAG: ${{ inputs.tag }}
      # The English pass keeps translation candidates, inflection forms and
      # citation counts for all languages in memory.
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Refuse to replace the published packs from a branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ] && [ "$TAG" = "dicts-v1" ]; then
            echo "::error::dicts-v1 is the release every installation reads: build it from main, or give a branch another tag such as dicts-test"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Show free disk space
        run: df -h "$RUNNER_TEMP" .

      # A run for a subset of pairs rebuilds only those packs. Starting from the
      # assets already on the release keeps dict-index.json complete.
      - name: Fetch existing packs from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/dicts"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # A release with an index must download completely: a failed download would let the build write an index
            # of the rebuilt packs alone over the published one.
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -x 'dict-index.json' > /dev/null; then
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/dicts" \
                --pattern 'dict-*.tsv.gz' --pattern 'dict-index.json' --pattern 'dict-build-report.json' --clobber
              cp "$RUNNER_TEMP/dicts/dict-index.json" "$RUNNER_TEMP/published-index.json"
            fi
          fi
          ls -l "$RUNNER_TEMP/dicts"

      - name: Build packs
        working-directory: tools/dict-build
        run: |
          node build.mjs \
            --pairs "$PAIRS" \
            --out "$RUNNER_TEMP/dicts" \
            --cache "$RUNNER_TEMP/dict-cache" \
            --pack-version "$(date -u +%Y%m%d)"

      - name: Verify packs
        working-directory: tools/dict-build
        run: node verify.mjs "$RUNNER_TEMP/dicts"

      # verify.mjs checks the packs the index lists, not the ones it lacks.
      - name: Keep every direction of the published index
        run: |
          [ -f "$RUNNER_TEMP/published-index.json" ] || exit 0
          node -e '
            const key = (p) => `${p.src}-${p.tgt}`;
            const after = new Set(require(process.argv[2]).packs.map(key));
            const lost = require(process.argv[1]).packs.map(key).filter((k) => !after.has(k));
            if (lost.length) {
              console.error("::error::the new index lacks directions of the published one: " + lost.join(", "));
              process.exit(1);
            }
          ' "$RUNNER_TEMP/published-index.json" "$RUNNER_TEMP/dicts/dict-index.json"

      - name: Summarize
        run: |
          {
            echo '| Pack | Entries | Forms | Bytes |'
            echo '| --- | ---: | ---: | ---: |'
            node -e '
              const idx = require(process.argv[1]);
              for (const p of idx.packs) console.log(`| ${p.file} | ${p.entries} | ${p.forms} | ${p.bytes} |`);
            ' "$RUNNER_TEMP/dicts/dict-index.json"
          } >> "$GITHUB_STEP_SUMMARY"
          du -sh "$RUNNER_TEMP/dict-cache" "$RUNNER_TEMP/dicts"

      - uses: actions/upload-artifact@v4
        with:
          name: dicts
          path: ${{ runner.temp }}/dicts
          if-no-files-found: error
          retention-days: 3

  upload:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dicts
          path: ${{ runner.temp }}/dicts

      # With the gh CLI of the runner: no third-party action gets the write permission of this workflow.
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" << 'EOF'
          Word-for-word dictionary packs for the dictionary translation service.
          Format and build rules: docs/dictionary-packs.md.

          Sources and licenses:
          - All packs except dict-en-zh-Hans: adapted (extracted, filtered and trimmed) from Wiktionary (Wiktionary contributors, https://www.wiktionary.org/), extracted by wiktextract and published by kaikki.org; CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0/).
          - dict-en-zh-Hans: adapted (extracted, filtered and trimmed) from ECDICT (https://github.com/skywind3000/ECDICT), Copyright (c) 2025 Linwei; MIT License.
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Dictionary packs ($TAG)" --latest=false --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$RUNNER_TEMP"/dicts/dict-*.tsv.gz "$RUNNER_TEMP/dicts/dict-index.json" "$RUNNER_TEMP/dicts/dict-build-report.json"
