name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run locales:check
      - run: npm test
      - run: npm run build

      - name: Read version
        id: version
        run: |
          echo "version=$(node -p "require('./static/manifest.json').version")" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: thunderbird-translate-${{ steps.version.outputs.version }}-${{ steps.version.outputs.sha }}
          path: web-ext-artifacts/*.xpi
          retention-days: 30

      - name: Update nightly pre-release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          file="web-ext-artifacts/thunderbird-translate-$VERSION-$SHA.xpi"
          cp "web-ext-artifacts/thunderbird-translate-$VERSION.xpi" "$file"
          gh release delete nightly --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create nightly "$file" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Nightly ($SHA)" \
            --notes "Automatic build of commit $GITHUB_SHA. For testing; use the latest versioned release for daily use."

      - name: Check whether the release exists
        if: github.event_name != 'pull_request'
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release and upload xpi
        if: github.event_name != 'pull_request' && steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: web-ext-artifacts/thunderbird-translate-${{ steps.version.outputs.version }}.xpi
          fail_on_unmatched_files: true
