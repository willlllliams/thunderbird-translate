name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only the release job writes to the repository (releases and tags).
permissions:
  contents: read

# One run per branch or pull request at a time. A newer push to a pull request cancels its running run; on main a
# running run finishes, and a run still waiting gives way to the newer one, which releases the same or a newer version.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run locales:check
      - run: npm run docs:check
      - run: npm run imports:check
      # Unit tests with the coverage thresholds of vitest.config.ts.
      - run: npm run test:coverage
      - run: npm run build
      # The source archive for addons.thunderbird.net, made from the commit of this run.
      - run: npm run source-zip

      - name: Read version
        id: version
        run: |
          echo "version=$(node -p "require('./static/manifest.json').version")" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # The build, thunderbird-translate-<version>.xpi, and the source archive.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: thunderbird-translate-${{ steps.version.outputs.version }}-${{ steps.version.outputs.sha }}
          path: |
            web-ext-artifacts/*.xpi
            web-ext-artifacts/*-source.zip
          if-no-files-found: error
          retention-days: 30

      # The section of this version in CHANGELOG.md; fails when it has none.
      - name: Release notes
        run: node scripts/release-notes.mjs "${{ steps.version.outputs.version }}" release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-${{ steps.version.outputs.version }}-${{ steps.version.outputs.sha }}
          path: release-notes.md
          retention-days: 30

  # The test build in a real, headless Thunderbird against a local mock server (npm run e2e).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 128 and 140: older ESR still in use; 153: current ESR; 157: latest release.
        thunderbird: [128.14.0esr, 140.17.0esr, 153.4.0esr, 157.0.1]
    name: e2e (Thunderbird ${{ matrix.thunderbird }})
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Libraries Thunderbird needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 libx11-xcb1 libxtst6

      - name: Download Thunderbird ${{ matrix.thunderbird }}
        env:
          TB_VERSION: ${{ matrix.thunderbird }}
        run: |
          base="https://ftp.mozilla.org/pub/thunderbird/releases/$TB_VERSION/linux-x86_64/en-US"
          # Releases from 135 on are .tar.xz, older ones .tar.bz2.
          for ext in tar.xz tar.bz2; do
            if curl -fsSL -o "$RUNNER_TEMP/thunderbird.$ext" "$base/thunderbird-$TB_VERSION.$ext"; then
              tar -xf "$RUNNER_TEMP/thunderbird.$ext" -C "$RUNNER_TEMP"
              break
            fi
          done
          test -x "$RUNNER_TEMP/thunderbird/thunderbird"
          echo "THUNDERBIRD_BIN=$RUNNER_TEMP/thunderbird/thunderbird" >> "$GITHUB_ENV"

      - run: npm run e2e

      # The screenshots the test build took: the message window with its translation, its summary and the text of its images.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ matrix.thunderbird }}
          path: .cache/e2e/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14

  # Releases come from main only: a manual run on another branch builds and tests, and publishes nothing.
  release:
    needs: [build, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      SHA: ${{ needs.build.outputs.sha }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: thunderbird-translate-${{ needs.build.outputs.version }}-${{ needs.build.outputs.sha }}
          path: web-ext-artifacts

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes-${{ needs.build.outputs.version }}-${{ needs.build.outputs.sha }}
          path: release-notes

      - name: Update nightly pre-release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file="web-ext-artifacts/thunderbird-translate-$VERSION-$SHA.xpi"
          cp "web-ext-artifacts/thunderbird-translate-$VERSION.xpi" "$file"
          gh release delete nightly --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create nightly "$file" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Nightly ($SHA)" \
            --notes "Automatic build of commit $GITHUB_SHA. For testing; use the latest versioned release for daily use."

      # A version is released once. A tag of the version without a release would give the release the commit of the
      # tag instead of this one, so the run fails then. The build and the source archive go to the release.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$VERSION is released already."
            exit 0
          fi
          tagged=$(git ls-remote --tags "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "v$VERSION" "v$VERSION^{}" | sort -k2 | tail -n 1 | cut -f1)
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::The tag v$VERSION points to $tagged, not to $GITHUB_SHA; delete it or change the version."
            exit 1
          fi
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" \
            --notes-file release-notes/release-notes.md --latest \
            "web-ext-artifacts/thunderbird-translate-$VERSION.xpi" \
\
            "web-ext-artifacts/thunderbird-translate-$VERSION-source.zip"
